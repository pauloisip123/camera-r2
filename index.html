<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2 Scanner with History</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; background: #000; }
        .status { padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.9em; margin-bottom: 10px; display: none; }
        .active { display: block; background: #e0f2fe; color: #0369a1; }
        .success { display: block; background: #dcfce7; color: #15803d; }
        .warning { display: block; background: #fef3c7; color: #92400e; }
        
        /* History Styles */
        .history-card { width: 100%; max-width: 400px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85em; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Scanner + CS Sync</h3>
        <div id="status" class="status">Initializing...</div>
        <div id="reader"></div>
    </div>

    <div class="history-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h4 style="margin:0;">Scan History</h4>
            <button onclick="clearHistory()" style="font-size: 0.7em; cursor:pointer;">Clear</button>
        </div>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Barcode</th>
                    <th>C/S NO.</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <audio id="beep" src="https://www.soundjay.com/buttons/beep-07a.wav" preload="auto"></audio>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzqlriKpg7N1jUH2cxeXiAgtjCA3-At6TrvLWXYARJy_PhgmYO1KyLUQOv8dIptQHdz/exec'; // Palitan ito
        const statusDiv = document.getElementById('status');
        const beep = document.getElementById('beep');
        const historyBody = document.getElementById('historyBody');
        let isLocked = false;

        // Load history pagbukas ng page
        window.onload = () => {
            loadHistory();
            startScanner();
        };

        async function startScanner() {
            const html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 15, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        if (/^\d{10}$/.test(decodedText) && !isLocked) {
                            syncToSheets(decodedText);
                        }
                    }
                );
                updateStatus("System Ready", "active");
            } catch (err) { updateStatus("Camera Error", "warning"); }
        }

        async function syncToSheets(code) {
            isLocked = true;
            updateStatus("Syncing: " + code, "active");

            try {
                // Gumamit kami ng fetch na may 'cors' pero dahil sa Google Script 
                // kailangan natin itong i-handle nang maigi.
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ barcode: code })
                });
                
                const result = await response.json();
                const csNo = result.csNo || "N/A";

                saveToLocalHistory(code, csNo);
                beep.play();
                updateStatus("Saved! CS: " + csNo, "success");
            } catch (e) {
                // Kung mag-error dahil sa CORS, i-save pa rin ang code sa UI
                saveToLocalHistory(code, "Checking...");
                updateStatus("Sent to Sheet", "success");
            }

            setTimeout(() => { 
                isLocked = false; 
                updateStatus("Ready for next scan", "active");
            }, 3000);
        }

        function saveToLocalHistory(barcode, csNo) {
            let history = JSON.parse(localStorage.getItem('scanHistory') || "[]");
            history.unshift({ barcode, csNo, time: new Date().toLocaleTimeString() });
            localStorage.setItem('scanHistory', JSON.stringify(history));
            renderHistory();
        }

        function loadHistory() {
            renderHistory();
        }

        function renderHistory() {
            let history = JSON.parse(localStorage.getItem('scanHistory') || "[]");
            historyBody.innerHTML = history.map(item => `
                <tr>
                    <td>${item.barcode}</td>
                    <td>${item.csNo}</td>
                </tr>
            `).join('');
        }

        function clearHistory() {
            if(confirm("Delete all history?")) {
                localStorage.removeItem('scanHistory');
                renderHistory();
            }
        }

        function updateStatus(msg, type) {
            statusDiv.innerText = msg;
            statusDiv.className = "status " + type;
        }
    </script>
</body>
</html>
